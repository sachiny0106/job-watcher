name: Job Watcher Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Job Watcher Cron"]
    types: [completed]

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:
      group: job-watcher-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Poll Telegram and process commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: npx tsx src/bot-poll.ts

      - name: Persist companies + offset
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "actions@github.com"
          git add companies.json .telegram-offset || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: bot processed Telegram updates [skip ci]"
            for i in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main || git rebase --abort || true
              if git push; then
                exit 0
              fi
              echo "push attempt $i failed, retrying…"
              sleep 5
            done
            exit 1
          fi

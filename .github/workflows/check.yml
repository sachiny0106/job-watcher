name: Job Watcher Cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: job-watcher-cron
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run cron
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: npm run cron

      - name: Persist state
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "actions@github.com"
          git add state.sqlite || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state [skip ci]"
            for i in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main || git rebase --abort || true
              if git push; then
                exit 0
              fi
              echo "push attempt $i failed, retrying…"
              sleep 5
            done
            echo "push failed after 3 attempts"
            exit 1
          fi
